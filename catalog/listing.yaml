  file: install-production-only.webp
  alt:
    en: The same install dialog with production only selected; the accelerator table now shows 1 NVIDIA GPU for production and 1 in total.
    ja: 同じインストールダイアログで「本番のみ」を選んだ状態。アクセラレータ欄は本番 1 NVIDIA GPU、合計 1 NVIDIA GPU に変わっています。
- name: version-select
  file: version-select.webp
  alt:
    en: Version menu open in the install dialog, listing 0.1.0 and 0.2.0 (recommended) with 0.2.0 checked, above the pinned-version and branch options.
    ja: インストールダイアログでバージョンの一覧を開いた状態。0.1.0 と 0.2.0（推奨）が並び、0.2.0 にチェックが付いています。下にはバージョン固定とブランチの選択肢があります。
- name: catalog-card
  file: catalog-card.webp
  alt:
    en: 'Catalog section of the Marketplace: AI Gateway and Embedding marked as installed, and the Inference card showing version 0.2.0, follow or pin updates, and an Install button.'
    ja: マーケットプレイスのカタログ欄。AI Gateway と Embedding はインストール済みで、Inference のカードにはバージョン 0.2.0、更新方法（自動で更新 / バージョンを固定）、インストールボタンが表示されています。
